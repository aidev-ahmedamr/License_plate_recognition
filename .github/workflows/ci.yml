name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lightweight test dependencies
        # Deliberately skips ultralytics/easyocr — the tests only exercise
        # pure logic (IOU, format validation, tracker voting, edit distance)
        # so CI stays fast and doesn't need to pull multi-GB model weights.
        run: |
          pip install opencv-python-headless numpy pytest flake8

      - name: Lint
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run unit tests
        run: |
          pytest tests/ -v
